'use strict';const $=x=>document.getElementById(x), esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=x=>Number(x).toLocaleString('fr-CA',{style:'currency',currency:'CAD'}), today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}, now=()=>today().slice(0,7), sum=a=>a.reduce((n,x)=>n+Math.round(x.amount*100),0)/100, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2), fresh=()=>({income:0,incomes:{},payRate:26,forecasts:{},pays:[],fixed:[],tx:[],debts:[],foodBudgets:{},cats:['Bouffe','Autres','Transport','Loisirs','Santé'],dark:false});let s=fresh(),tab='Accueil',m=now(),edit=null;function migrate(x){if(x.fixed){x.foodBudgets=x.foodBudgets||{};x.pays=x.pays||[];x.payRate=x.payRate??26;x.forecasts=x.forecasts||{};x.cats=x.cats.filter(c=>c!=='Essence');x.tx.forEach(t=>{if(t.cat==='Essence')t.cat='Autres'});return x;}let z=fresh();z.income=x.income||0;z.dark=!!x.dark;z.debts=x.debts||[];z.fixed=(x.budget||[]).map(a=>({id:uid(),name:a.name,amount:a.amount,start:now(),end:''}));z.tx=(x.tx||[]).map(a=>({...a,id:uid(),cat:/bouffe|épicerie|restaurant/i.test(a.name)?'Bouffe':/gaz|essence/i.test(a.name)?'Autres':'Autres'}));return z}try{let raw=localStorage.getItem('mf-v2')||localStorage.getItem('mf-v1');if(raw)s=migrate(JSON.parse(raw))}catch(e){alert('Lecture des données impossible.')}function save(){try{localStorage.setItem('mf-v2',JSON.stringify(s))}catch(e){alert('Sauvegarde impossible. Exporte tes données.')}}const active=()=>s.fixed.filter(a=>a.start<=m&&(!a.end||a.end>m)), tx=()=>s.tx.filter(a=>a.date.slice(0,7)===m), expenses=()=>tx().filter(a=>a.type!=='income'), catTotal=c=>sum(expenses().filter(a=>a.cat===c)), income=()=>s.incomes[m]??0,pays=()=>s.pays.filter(x=>x.date.slice(0,7)===m||(x.actualDate||'').slice(0,7)===m),received=()=>sum(s.pays.filter(x=>x.actual!==null&&(x.actualDate||x.date).slice(0,7)===m).ma function forecastCard(){let a=s.forecasts[m]||{},rate=a.rate??s.payRate??26,hours=a.hours,net=hours==null?null:payroll(hours*12/52,rate).net*52/12;return `<div class="card forecast"><details><summary>Paie nette prévue<b>${net===null?"—":money(net)}</b></summary><form id="forecast"><label>Taux horaire ($/h)<input name="rate" type="number" min="0" step="0.01" required value="${esc(rate)}"></label><label>Heures prévues ce mois<input name="hours" type="number" min="0" step="0.01" required value="${esc(hours??'')}"></label><button>Calculer</button></form><small>Estimation Québec 2026, annualisée sur 12 mois. Non incluse dans les revenus reçus.</small></details></div>`}function render(){document.body.classList.toggle('dark',s.dark);let tabs=['Accueil','Fixes','Bouffe','Transactions','Dettes','Réglages'];$('nav').innerHTML=tabs.map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${t}</button>`).join('');let f=sum(active()),v=sum(expenses()),inc=income()+received()+sum(tx().filter(a=>a.type==='income')),h=`<section><label>Mois consulté<input id="month" type="month" value="${m}"></label></section>`;if(tab==='Accueil'){h+=`<section class="hero">Argent restant<div class="big">${money(inc-f-v)}</div><div>Revenus reçus moins dépenses</div></section><div class="grid"><div class="card">Revenus<br><b>${money(inc)}</b></div><div class="card">Dépenses totales<br><b>${money(f+v)}</b></div></div><section><div class="paygrid"><div><h2>Paies reçues</h2><b>${money(received())}</b></div>${forecastCard()}</div>${form('quickPay',field('amount','Montant net de la paie ($)','','number'),'Ajouter la paie')}<p class="muted">Chaque paie est additionnée au total du mois sélectionné.</p>${s.pays.filter(x=>x.actual!=null&&(x.actualDate||x.date).slice(0,7)===m).slice().reverse().map(x=>row(x.actualDate||x.date,x.actual,btn('delPay',x.id,'×'))).join('')}${income()?row('Autres revenus déjà enregistrés',income()):''}</section><section><h2>Répartition du mois</h2>${row('Dépenses fixes',f)}${s. name" value="${esc(a?.name||'')}"></label>`+field('date','Date',a?.date||(m===now()?today():m+'-01'),'date'),a?'Enregistrer':'Ajouter au total')}</section><section><h2>Historique</h2>${list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>row(x.date+' · '+(x.name||x.cat)+(x.type==='income'?' (revenu)':''),x.amount,btn('editTx',x.id,'Modifier')+btn('delTx',x.id,'×'))).join('')||'<p>Aucune transaction.</p>'}</section>`}if(tab==='Dettes'){let a=edit!==null?s.debts[+edit]:null;h+=`<section><h2>Dettes</h2><p class="muted">Soldes suivis manuellement. Enregistre les remboursements dans Transactions pour les inclure dans tes dépenses.</p>${s.debts.map((x,i)=>row(x.name,x.balance,btn('editDebt',i,'Modifier')+btn('delDebt',i,'×'))).join('')}${form('debt',field('name','Nom',a?.name||'')+field('balance','Solde restant ($)',a?.balance||'','number'),a?'Enregistrer':'Ajouter')}</section>`}if(tab==='Réglages')h+=`<section><h2>Catégories</h2>${s.cats.map(c=>`<div class="line">${esc(c)} ${['Bouffe','Autres'].includes(c)?'':btn('delCat',c,'×')}</div>`).join('')}${form('cat',field('name','Nouvelle catégorie'))}</section><section><h2>Sauvegarde</h2><button id="export">Exporter JSON</button><label>Restaurer<input type="file" id="import" accept=".json"></label><p class="muted">Données locales uniquement. Exporte une copie régulièrement.</p></section>`;$('view').innerHTML=h;$('month').onchange=e=>{if(e.target.value){m=e.target.value;edit=null;render()}};bind('forecast',a=>{let rate=+a.rate,hours=+a.hours;if(!Number.isFinite(rate)||!Number.isFinite(hours)||rate<0||hours<0)return;s.payRate=rate;s.forecasts[m]={rate,hours}});bind('quickPay',a=>{let amount=+a.amount;if(!Number.isFinite(amount)||amount<=0){alert('Entre un montant positif.');return}let date=m===now()?today():m+'-01';s.pays.push({id:uid(),date,actualDate:date,actual:amount,net:null,hours:null,rate:null})});bind('foodBudget',a=>{s.foodBudgets[m]=+a.amount});bind('income',a=>{s.incomes[m]=+a.amount;if(m>=now())s.income=+a.a
