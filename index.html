<!doctype html><html lang="fr-CA"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b39"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Mes finances</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f1f5f4;color:#17342f}main{max-width:780px;margin:auto;padding:20px 16px 110px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px}h2{font-size:20px}section,.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #00000008}.hero{background:#123b39;color:white}.big{font-size:34px;font-weight:700}label{display:block;margin:12px 0 5px;color:inherit}input,select,button{font:inherit;border:1px solid #aabbb5;border-radius:10px;padding:11px;max-width:100%}input,select{width:100%;background:transparent;color:inherit}button{background:#176c57;color:white;border:0;cursor:pointer}button.alt{background:#dce9e4;color:#17342f}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#123b39;padding:8px 4px calc(8px + env(safe-area-inset-bottom));gap:2px}nav button{background:transparent;font-size:12px;flex:1;max-width:135px;padding:12px 2px}nav button.active{background:#327b69}.line{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid #aabbb550;padding:12px 0}.line span{overflow-wrap:anywhere}.line button{padding:6px 10px}.muted{opacity:.75;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:right;padding:8px 3px;border-bottom:1px solid #aabbb550}td:first-child,th:first-child{text-align:left}progress{width:100%;accent-color:#176c57}form button{margin-top:14px}body.dark{background:#101b1a;color:#e4efeb}body.dark section,body.dark .card{background:#21312e}body.dark .hero{background:#123b39} @media(max-width:360px){.grid{grid-template-columns:1fr}}
</style><main><header><h1>Mes finances</h1><button class="alt" id="theme">☾</button></header><div id="view"></div></main><nav id="nav"></nav><script>
'use strict';const $=id=>document.getElementById(id), money=n=>Number(n).toLocaleString('fr-CA',{style:'currency',currency:'CAD'}), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), month=()=>new Date().toLocaleDateString('en-CA').slice(0,7), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const init={income:0,budget:[],tx:[],debts:[],invest:[],growth:3,inflation:2,years:20,dark:false};let s=structuredClone(init);try{let x=localStorage.getItem('mf-v1');if(x)s=JSON.parse(x)}catch(e){alert('Impossible de lire la sauvegarde locale.')};let tab=0, selected=today().slice(0,7);const sum=(a,f)=>a.reduce((v,x)=>v+f(x),0), save=()=>{try{localStorage.setItem('mf-v1',JSON.stringify(s))}catch(e){alert('Sauvegarde locale impossible : exporte tes données.')}}, field=(label,name,value=0,step='0.01',min=0,max='')=>`<label>${label}<input type="number" name="${name}" value="${value}" step="${step}" min="${min}" ${max!==''?`max="${max}"`:''} required></label>`, namefield=(label='Nom')=>`<label>${label}<input name="name" maxlength="100" required></label>`, form=(id,body,btn='Enregistrer')=>`<form id="${id}">${body}<button>${btn}</button></form>`, line=(a,b,key,i)=>`<div class="line"><span>${esc(a)}</span><span>${b} <button class="alt" data-del="${key}" data-i="${i}" aria-label="Supprimer">×</button></span></div>`, bind=(id,fn)=>{let el=$(id);if(el)el.onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(el)));save();render()}};const tabs=['Accueil','Budget','Transactions','Dettes','Placements','Prévisions','Réglages'];function debtCalc(d){let b=d.balance,r=d.rate/1200,m=0,interest=0;while(b>0.005&&m<1200){let i=b*r;if(d.pay<=i)return null;interest+=i;b=Math.max(0,b+i-d.pay);m++}return b>0.005?null:{m,interest}}function render(){document.body.classList.toggle('dark',s.dark);$('nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${i}" class="${tab===i?'active':''}">${t}</button>`).join('');let budget=sum(s.budget,x=>x.amount), debt=sum(s.debts,x=>x.pay), invest=sum(s.invest,x=>x.monthly), tx=s.tx.filter(x=>x.date.startsWith(selected)), actual=sum(tx.filter(x=>x.type==='expense'),x=>x.amount), incomeActual=sum(tx.filter(x=>x.type==='income'),x=>x.amount), net=s.income-budget-debt-invest;let h='';if(tab===0)h=`<section class="hero"><div>Disponible prévu par mois</div><div class="big">${money(net)}</div><div class="muted">Après dépenses, dettes et placements</div></section><div class="grid"><div class="card">Revenu net<br><b>${money(s.income)}</b></div><div class="card">Dépenses prévues<br><b>${money(budget)}</b></div><div class="card">Dettes restantes<br><b>${money(sum(s.debts,x=>x.balance))}</b></div><div class="card">Placements actuels<br><b>${money(sum(s.invest,x=>x.balance))}</b></div></div><section><h2>Suivi réel</h2><label>Mois<input id="month" type="month" value="${selected}"></label><p>Revenus saisis : ${money(incomeActual)}</p><p>Dépenses saisies : ${money(actual)}</p><p>Solde des transactions : ${money(incomeActual-actual)}</p><progress max="${Math.max(budget,actual,1)}" value="${actual}"></progress><p class="muted">Les transactions sont distinctes du budget prévu.</p></section>`;
if(tab===1)h=`<section><h2>Revenu mensuel net</h2>${form('income',field('Revenu après impôts ($)','income',s.income))}</section><section><h2>Dépenses prévues · ${money(budget)}</h2>${s.budget.map((x,i)=>line(x.name,money(x.amount),'budget',i)).join('')}${form('budget',namefield('Catégorie')+field('Montant mensuel ($)','amount'),'Ajouter')}</section>`;
if(tab===2)h=`<section><h2>Nouvelle transaction</h2>${form('tx',`<label>Type<select name="type"><option value="expense">Dépense</option><option value="income">Revenu</option></select></label><label>Date<input type="date" name="date" value="${today()}" required></label>`+namefield('Description / catégorie')+field('Montant ($)','amount'),'Ajouter')}</section><section><h2>Historique</h2><label>Mois<input id="month" type="month" value="${selected}"></label>${s.tx.map((x,i)=>x.date.startsWith(selected)?line(x.date+' · '+x.name,(x.type==='expense'?'−':'+')+money(x.amount),'tx',i):'').join('')}</section>`;
if(tab===3)h=`<section><h2>Mes dettes</h2>${s.debts.map((d,i)=>{let a=debtCalc(d);return line(d.name,money(d.balance),'debts',i)+`<p class="muted">${money(d.pay)}/mois · ${d.rate}% · ${a?a.m+' mois, intérêts '+money(a.interest):'Paiement insuffisant ou durée > 100 ans'}</p><button class="alt" data-edit="debts" data-i="${i}">Modifier</button>`}).join('')}${form('debts',namefield()+field('Solde actuel ($)','balance')+field('Taux annuel (%)','rate',5)+field('Paiement mensuel ($)','pay'),'Ajouter une dette')}</section>`;
if(tab===4)h=`<section><h2>Mes placements</h2>${s.invest.map((x,i)=>line(x.name,money(x.balance),'invest',i)+`<p class="muted">${money(x.monthly)}/mois · rendement ${x.rate}%</p><button class="alt" data-edit="invest" data-i="${i}">Modifier</button>`).join('')}${form('invest',namefield('Compte (CELI, REER…)')+field('Solde actuel ($)','balance')+field('Cotisation mensuelle ($)','monthly')+field('Rendement annuel estimé (%)','rate',5,.01,-99),'Ajouter un placement')}</section>`;
if(tab===5){let balances=s.invest.map(x=>x.balance), ds=s.debts.map(x=>x.balance), rows='';for(let y=1;y<=s.years;y++){let inc=s.income*(1+s.growth/100)**(y-1), exp=budget*(1+s.inflation/100)**(y-1), free=0;for(let m=0;m<12;m++){let paid=0;ds=ds.map((b,i)=>{let due=b*(1+s.debts[i].rate/1200),p=Math.min(due,s.debts[i].pay);paid+=p;return due-p});balances=balances.map((b,i)=>b*(1+s.invest[i].rate/100)**(1/12)+s.invest[i].monthly);free+=inc-exp-paid-invest}rows+=`<tr><td>${y}</td><td>${money(free)}</td><td>${money(sum(ds,x=>x))}</td><td>${money(sum(balances,x=>x))}</td></tr>`}h=`<section><h2>Hypothèses</h2>${form('forecast',field('Hausse annuelle du revenu net (%)','growth',s.growth,.1,-99)+field('Inflation des dépenses (%)','inflation',s.inflation,.1,-99)+field('Horizon (années)','years',s.years,1,1,50))}<p class="muted">Cotisations fixes, rendements constants, aucun impôt sur placements modélisé. Excédents non réinvestis automatiquement.</p></section><section><h2>Projection annuelle</h2><table><thead><tr><th>An</th><th>Excédent</th><th>Dettes</th><th>Placements</th></tr></thead><tbody>${rows}</tbody></table></section>`}
if(tab===6)h=`<section><h2>Sauvegarde</h2><p>Les données restent dans ce navigateur. Exporte une copie régulièrement.</p><button id="export">Exporter JSON</button><label>Restaurer une sauvegarde<input type="file" id="import" accept=".json,application/json"></label><p><button class="alt" id="reset">Effacer toutes les données</button></p></section>`;$('view').innerHTML=h;bind('income',v=>s.income=+v.income);for(let k of ['budget','tx','debts','invest'])bind(k,v=>{for(let a of ['amount','balance','rate','pay','monthly'])if(a in v)v[a]=+v[a];s[k].push(v);if(k==='tx')selected=v.date.slice(0,7)});bind('forecast',v=>{for(let k in v)s[k]=+v[k]});if($('month'))$('month').onchange=e=>{selected=e.target.value;render()};if($('export'))$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='mes-finances-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('import'))$('import').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());let num=n=>typeof n==='number'&&Number.isFinite(n), valid=(k,fields)=>Array.isArray(x[k])&&x[k].every(a=>typeof a.name==='string'&&fields.every(f=>num(a[f])));if(!num(x.income)||!num(x.growth)||!num(x.inflation)||!Number.isInteger(x.years)||x.years<1||x.years>50||!valid('budget',['amount'])||!valid('tx',['amount'])||!x.tx.every(a=>typeof a.date==='string'&&['income','expense'].includes(a.type))||!valid('debts',['balance','rate','pay'])||!valid('invest',['balance','rate','monthly']))throw Error();if(confirm('Remplacer tes données actuelles ?')){s=x;save();render()}}catch{alert('Fichier de sauvegarde invalide.')}};if($('reset'))$('reset').onclick=()=>{if(confirm('Effacer définitivement les données locales ?')){s=structuredClone(init);save();render()}}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab!==undefined){tab=+b.dataset.tab;render()}if(b.dataset.del&&confirm('Supprimer cette entrée ?')){s[b.dataset.del].splice(+b.dataset.i,1);save();render()}if(b.dataset.edit){let k=b.dataset.edit,i=+b.dataset.i,x=s[k][i],f=$(k);f.elements.name.value=x.name;for(let a of ['balance','rate','pay','monthly'])if(f.elements[a])f.elements[a].value=x[a];f.querySelector('button').textContent='Enregistrer les modifications';f.onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f));for(let a in v)if(a!=='name')v[a]=+v[a];s[k][i]=v;save();render()};f.scrollIntoView({behavior:'smooth'})}});$('theme').onclick=()=>{s.dark=!s.dark;save();render()};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></html>
